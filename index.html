<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Планер выставок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
 --bg:var(--tg-theme-secondary-bg-color,#f3f3f1);
 --card:var(--tg-theme-bg-color,#ffffff);
 --ink:var(--tg-theme-text-color,#1b1b1d);
 --mut:var(--tg-theme-hint-color,#7a7b80);
 --line:rgba(128,128,128,.18);
 --accent:#2f6f9e; --accent-tx:#ffffff;
 --link:var(--tg-theme-link-color,#2f6f9e);
 --bad:#e0664d; --warn:#d79a3a; --good:#3fa978; --faint:#a6a7ac;
 --pagebg:var(--bg); --cellbg:var(--card); --selbg:rgba(47,111,158,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 96px;background:var(--pagebg);min-height:60vh;transition:background .3s}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.head-in{max-width:900px;margin:0 auto;padding:8px 12px 0}
.h1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h1 b{font-size:15px;font-weight:650}
.gear{border:none;background:transparent;font-size:18px;cursor:pointer;color:var(--mut);padding:4px 6px;transition:transform .12s}
.gear:active{transform:scale(.9) rotate(35deg)}
.savebtn{border:1.5px solid var(--line);background:transparent;color:var(--mut);font-size:12.5px;font-weight:650;border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s;flex:0 0 auto}
.savebtn:disabled{cursor:default}
.savebtn.dirty{border-color:var(--accent);color:var(--accent-tx);background:var(--accent);cursor:pointer;animation:pulseSave 1.6s ease-in-out infinite}
.savebtn.err{border-color:var(--bad);color:var(--bad);background:transparent;animation:none}
@keyframes pulseSave{0%,100%{opacity:1}50%{opacity:.72}}
.exbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.exbar::-webkit-scrollbar{display:none}
.exchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s,border-color .2s,color .2s}
.exchip:active{transform:scale(.95)}
.exchip.on{color:#fff}
.yrbar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:7px;align-items:center}
.yrbar::-webkit-scrollbar{display:none}
.yrlbl{font-size:11px;color:var(--mut);flex:0 0 auto;margin-right:2px}
.yr{flex:0 0 auto;border:none;background:transparent;color:var(--mut);font-size:13px;padding:4px 9px;border-radius:8px;cursor:pointer;transition:transform .12s}
.yr:active{transform:scale(.92)}
.yr.on{background:var(--accent);color:#fff;font-weight:700}
.yr-add{flex:0 0 auto;width:24px;height:24px;padding:0;margin-left:2px;border:1.5px dashed var(--mut);background:transparent;color:var(--mut);border-radius:50%;font-size:14px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,border-color .2s,color .2s}
.yr-add:active{transform:scale(.88)}
nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;background:transparent;padding:8px 12px;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:650}
section{display:none;padding-top:14px}section.on{display:block;animation:fadeUp .24s ease both}
.addbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.addbar .grp{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.add{background:var(--accent);color:var(--accent-tx);border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.muted{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--cellbg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:transform .12s}
.kpi.clk{cursor:pointer}.kpi.clk:active{transform:scale(.96)}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.block{margin-top:20px}
.block h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px;font-weight:700}
.barrow{display:flex;align-items:center;gap:9px;margin:6px 0}
.barrow.clk{cursor:pointer}
.barrow .nm{width:130px;font-size:13px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .25s,background .25s}
.barrow .pc{width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--mut)}
.card{background:var(--cellbg);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;animation:slideIn .22s ease both;transition:background .18s,box-shadow .18s}
.card:hover{background:var(--selbg)}
.card.removing{animation:fadeOut .25s forwards}
.card .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .nm{font-weight:650;font-size:15px}
.card .sub{font-size:12px;color:var(--faint)}
.card .pc{font-size:14px;font-weight:800;white-space:nowrap}
.icobtn{border:none;background:transparent;color:var(--mut);font-size:15px;cursor:pointer;padding:2px 4px;transition:transform .12s}
.icobtn:active{transform:scale(.85)}
.tr{height:7px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:9px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--cellbg);color:var(--mut);cursor:pointer;user-select:none;transition:transform .12s,background .2s,color .2s}
.chip:active{transform:scale(.9)}
.chip .bx{width:13px;height:13px;border:1.5px solid var(--faint);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.chip.done{color:var(--good);border-color:transparent;background:rgba(63,169,120,.13)}
.chip.done .bx{background:var(--good);border-color:var(--good)}
.chip.na{color:var(--faint);text-decoration:line-through;background:var(--bg);border-color:transparent}
.chip.na .bx{background:var(--faint);border-color:var(--faint)}
.chip.over{border-color:var(--bad);color:var(--bad)}
.chip.pop{animation:pop .28s ease}
.money{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.money span{color:var(--mut);font-size:11px;display:block}.money b{font-weight:700}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.rej{opacity:.6}
.status{font-size:10.5px;font-weight:800}
.pill{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.pill.ptype{background:transparent;border:1.5px solid var(--faint);color:var(--mut);font-weight:700;text-transform:none;letter-spacing:0;padding:1px 8px}
.meta-highlight{font-size:15px;font-weight:750;margin-top:6px;letter-spacing:.01em}
.contactline{font-size:12.5px;color:var(--mut);margin-top:3px}
.rownum{display:inline-block;min-width:22px;text-align:center;font-size:11px;font-weight:800;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-right:6px;vertical-align:middle;cursor:default}
.dl,.pl{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.dl{color:var(--mut);background:var(--bg);border:1px solid var(--line)}
.dl.ok,.pl.good{color:var(--good);background:rgba(63,169,120,.14);border:none}
.dl.warn,.pl.warn{color:var(--warn);background:rgba(215,154,58,.16);border:none}
.dl.over,.pl.bad{color:var(--bad);background:rgba(224,102,77,.15);border:none}
.spark{vertical-align:middle;margin-left:4px}
.paybar{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.paybar>div{height:100%;background:#5b7fc7;border-radius:99px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.toolbar input[type=search]{flex:1;min-width:150px}
.sortbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.sortlbl{font-size:12px;color:var(--mut)}
.sortsel,.fltf,.fltv{width:auto;flex:0 0 auto;padding:7px 10px;font-size:13px}
.sortdir{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
.cfgbtn{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;transition:transform .12s}
.cfgbtn:active{transform:scale(.95)}
.fltbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,border-color .2s,color .2s}
.fltbtn:active{transform:scale(.95)}
.fltbtn.active{border-color:var(--accent);color:var(--accent)}
.fbadge{background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.fltmodal .fld{margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:9px;background:var(--selbg);color:var(--accent);border-radius:99px;padding:6px 13px;font-size:13px;margin:0 6px 10px 0}
.fchip .fx{cursor:pointer;font-weight:800}
.stcard{background:var(--cellbg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;animation:slideIn .22s ease both;transition:background .18s}
.stcard:hover{background:var(--selbg)}
.stcard .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stcard .co{font-weight:650}.stcard .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.stcard a{color:var(--link);text-decoration:none}
.dot{color:var(--accent);font-weight:800}
.center{text-align:center;color:var(--mut);padding:26px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--card);width:100%;max-width:820px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:fadeUp .26s cubic-bezier(.2,.8,.2,1) both}
.modal h3{margin:2px 0 14px;font-size:17px}
.fld{margin-bottom:11px}.fld label{font-size:12px;color:var(--mut);display:block;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:8px;margin-top:8px}
.mbtns button{flex:1;padding:12px;border-radius:11px;border:none;font-size:15px;font-weight:650;cursor:pointer;transition:transform .1s}
.mbtns button:active{transform:scale(.97)}
.save{background:var(--accent);color:var(--accent-tx)}
.cancel{background:var(--bg);color:var(--ink);border:1px solid var(--line)!important}
.del{background:transparent;color:var(--bad);border:1px solid var(--line)!important;flex:0 0 auto!important;width:46px}
.mbtns button.eq{flex:1 1 0!important;width:auto!important}
.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:auto}
.dcfg{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.dcfg .nm{flex:1;font-size:14px}
.dcfg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--ink);font-size:14px}
.dcfg input[type=checkbox]{width:auto}
.dcfg input[type=text],.dcfg input[data-lab],.dcfg input[type=date]{flex:1;width:auto;padding:7px 10px;font-size:14px}
.dcfg input[type=color]{width:38px;height:34px;padding:2px;flex:0 0 auto}
.progress-line{display:flex;align-items:center;gap:8px;background:var(--cellbg);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:10px;font-size:14px}
.progress-line b{font-weight:800}
.debt{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.debt b{color:var(--bad)}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.leg{font-size:12.5px}.leg div{display:flex;align-items:center;gap:7px;margin:3px 0}
.leg i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.mtxwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mtx{border-collapse:collapse;font-size:11px}
.mtx th{font-weight:600;color:var(--mut);padding:2px 4px;text-align:center;white-space:nowrap}
.mtx td{padding:2px}.mtx .mname{font-size:12px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.mcell{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.dtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.dtable th,.dtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.linkbtn{border:none;background:transparent;color:var(--link);font-size:13px;cursor:pointer;padding:2px 4px}
.clientsec{margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}
.clientrow{padding:7px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.clientrow .cm{font-size:12px;color:var(--mut)}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center}
.lock.on{display:flex}
.lockbox{width:100%;max-width:300px;text-align:center;padding:20px}
.lockttl{font-size:22px;font-weight:800;margin-bottom:6px}
.locksub{font-size:13px;color:var(--mut);margin-bottom:24px;min-height:18px}
.dots{display:flex;gap:15px;justify-content:center;margin-bottom:30px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--mut);display:block}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.dots.err i{border-color:var(--bad)}.dots.err{animation:shake .42s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:250px;margin:0 auto}
.pad button{aspect-ratio:1;height:auto;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;color:var(--ink);cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;padding:0}
.pad button:active{transform:scale(.93)}.pad .empty{visibility:hidden;border:none;background:transparent}
.lockforgot{margin-top:24px;font-size:12.5px;color:var(--mut);cursor:pointer;text-decoration:underline}
#report{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(14px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
 body.printing>*{display:none!important}
 body.printing #report{display:block!important;padding:0}
 body.printing{background:#fff}
 #report h1{font-size:20px}#report h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
 #report table{width:100%;border-collapse:collapse;font-size:12px}#report th,#report td{border:1px solid #ccc;padding:5px 7px;text-align:left}
}
#report h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
#report table{width:100%;border-collapse:collapse;font-size:12.5px}
#report th,#report td{border:1px solid var(--line);padding:5px 7px;text-align:left}
#report th{background:var(--bg)}
</style>
</head>
<body>
<header><div class="head-in">
 <div class="h1"><b id="evname">Планер выставок</b><button class="savebtn" id="saveBtn" disabled>Сохранено ✓</button><button class="gear" id="gear">⚙</button></div>
 <div class="exbar" id="exbar"></div>
 <div class="yrbar" id="yrbar"></div>
 <nav id="nav"></nav>
</div></header>
<div class="wrap">
 <section id="obz" class="on"></section>
 <section id="pro"></section>
 <section id="uch"></section>
 <section id="ste"></section>
 <section id="zst"></section>
 <section id="ana"></section>
</div>
<div id="lock" class="lock"><div class="lockbox">
 <div class="lockttl">Планер</div>
 <div class="locksub" id="lockSub">Введите PIN</div>
 <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
 <div class="pad" id="pad">
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  <button class="empty"></button><button data-k="0">0</button><button data-k="del">⌫</button>
 </div>
 <div class="lockforgot" id="lockForgot">Не помню PIN</div>
</div></div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div id="report"></div>
<datalist id="dl_company"></datalist>
<datalist id="dl_builder"></datalist>
<datalist id="dl_mgr"></datalist>
<input type="file" id="file" accept="application/json" style="display:none">
<input type="file" id="xfile" accept=".xlsx,.xls" style="display:none">
<script>
/* ================= Планер выставок ================= */
var TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('secondary_bg_color');}catch(e){}}

/* ================= FIREBASE (облачное хранилище, работает на любом устройстве) =================
   Как подключить (один раз, 5 минут):
   1) Откройте https://console.firebase.google.com → "Add project" → создайте проект (бесплатно).
   2) В проекте слева: Build → Firestore Database → Create database → режим "Start in test mode"
      (регион любой, например eur3).
   3) Слева вверху ⚙ → Project settings → вкладка "General" → внизу "Your apps" → добавьте
      веб-приложение (иконка </>), название любое. Firebase покажет объект firebaseConfig —
      скопируйте его целиком и вставьте вместо FIREBASE_CONFIG ниже.
   4) В Firestore Database → вкладка "Rules" вставьте и нажмите "Publish":
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /planners/{docId} { allow read, write: if true; }
          }
        }
      ВАЖНО: эти правила означают, что доступ к документу возможен, только если знать его ID
      (это SHA-256-хэш вашего PIN) — Firestore не даёт "посмотреть список всех документов".
      Это защита "по неизвестности пути", а НЕ полноценная авторизация: 6-значный PIN даёт
      1 000 000 комбинаций, что делает случайный перебор нецелесообразным, но не защищает от
      целенаправленной атаки. Если данные по-настоящему чувствительные — в будущем стоит

var DIRTY=false, SAVING=false;

function updateSaveBtn(){
 var b=document.getElementById('saveBtn');if(!b)return;
 b.classList.remove('dirty','err');
 if(SAVING){b.textContent='Сохранение…';b.disabled=true;}
 else if(DIRTY){b.textContent='Сохранить';b.disabled=false;b.classList.add('dirty');}
 else{b.textContent='Сохранено ✓';b.disabled=true;}
}
// Раньше это было автосохранение (таймер 400мс после каждого изменения). Теперь только
// помечаем, что есть несохранённые изменения, и подсвечиваем кнопку — саму запись в
// облако делает persist(), который вызывается ТОЛЬКО кликом по кнопке "Сохранить"
// (плюс подстраховка при закрытии приложения, см. flushSave).
function saveSoon(){DIRTY=true;updateSaveBtn();}
function persist(){
 if(SAVING||!PLANNER_DOC_ID)return;
 SAVING=true;updateSaveBtn();
 var s=JSON.stringify(STATE);
 try{localStorage.setItem(localCacheKey(),s);}catch(e){} // локальный кэш — чтобы приложение открывалось мгновенно и работало офлайн
 function finish(ok){
  SAVING=false;if(ok)DIRTY=false;updateSaveBtn();
  var b=document.getElementById('saveBtn');if(b&&!ok)b.classList.add('err');
 }
 if(!fbDb){finish(true);return;} // Firebase не настроен — данные остаются только локально в этом браузере
 fbDb.collection('planners').doc(PLANNER_DOC_ID).set({data:s,updated:Date.now()})
  .then(function(){finish(true);haptic('light');})
  .catch(function(err){
   console.error('Firestore write failed',err);
   var msg='Не удалось сохранить данные в облако. Проверьте соединение.';
   try{TG&&TG.showAlert?TG.showAlert(msg):alert(msg);}catch(e){alert(msg);}
   finish(false);
  });
}
// подстраховка: если пользователь закрывает/сворачивает приложение с несохранёнными
// изменениями, всё равно пробуем сохранить, чтобы не потерять данные
function flushSave(){if(DIRTY&&!SAVING)persist();}
// Загрузка данных планера по конкретному docId (=hash PIN). cb(state|null, 'cloud'|'cache'|'notfound'|'error')
function loadPlanner(docId,cb){
 var cached=null;try{var c=localStorage.getItem('plannercache_'+docId);cached=c?JSON.parse(c):null;}catch(e){}
 if(!fbDb){cb(cached,cached?'cache':'notfound');return;}
 fbDb.collection('planners').doc(docId).get().then(function(snap){
  if(snap.exists){
   try{cb(JSON.parse(snap.data().data),'cloud');return;}catch(e){console.error('parse failed',e);}
  }
  cb(cached,cached?'cache':'notfound');
 }).catch(function(err){
  console.error('Firestore read failed',err);
  cb(cached,cached?'cache':'error'); // офлайн/ошибка сети — пробуем локальный кэш как запасной вариант
 });
}

function sameArr(a,b){if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}

 // переименований в UCH_RENAME), а не по индексу — иначе при простой перестановке массива
 // у всех существующих участников отметки "уедут" не на те этапы.
 if(!sameArr(m.uchSteps,NEW_UCH_STEPS)){
  var oldSteps=m.uchSteps.slice();

   var old=Array.isArray(r.st)?r.st:[];

  });}}

 }
 PRO_STEPS=m.proSteps; UCH_STEPS=m.uchSteps;
 m.proDue=m.proDue||[]; m.uchDue=m.uchDue||[];

 m.tabCfg=m.tabCfg||{}; m.ana=m.ana||{}; if(!m.ana.metric)m.ana.metric='uch'; if(!m.ana.chart)m.ana.chart='line'; if('pie' in m.ana)delete m.ana.pie;
 if(!Array.isArray(m.ana.exs)||!m.ana.exs.length)m.ana.exs=[m.curEx];

 if(!m.ana.exs.length)m.ana.exs=[m.curEx];
 m.trend=m.trend||{};
 if(m.pin===undefined)m.pin=pinHash('1717'); if(m.total===undefined)m.total=null;
 st.data=st.data||{};
 m.exhibitions.forEach(function(ex){st.data[ex.id]=st.data[ex.id]||{};});
 // список менеджеров (для согласований)
 if(!Array.isArray(m.managers)){
  var seen={},lst=DEFAULT_MGRS.slice();lst.forEach(function(n){seen[n]=1;});
  for(var ei0 in st.data){for(var yr0 in st.data[ei0]){((st.data[ei0][yr0]||{}).stands||[]).forEach(function(s){if(s.mgr&&!seen[s.mgr]){seen[s.mgr]=1;lst.push(s.mgr);}});}}
  m.managers=lst;
 }
 // normalize every bucket
 for(var ei in st.data){for(var yr in st.data[ei]){normBucket(st.data[ei][yr]);}}

function normBucket(b){
 b.stands=b.stands||[];b.pro=b.pro||[];b.uch=b.uch||[];
 b.pro.forEach(function(r){if(!Array.isArray(r.st))r.st=PRO_STEPS.map(function(){return 0;});while(r.st.length<PRO_STEPS.length)r.st.push(0);if(r.sbase===undefined)r.sbase=(r.status==='Отказ'?'Отказ':'Активен');

  if(r.contact===undefined)r.contact='';if(r.phone===undefined)r.phone='';if(r.email===undefined)r.email='';});
 b.uch.forEach(function(r){if(!Array.isArray(r.st))r.st=UCH_STEPS.map(function(){return 0;});while(r.st.length<UCH_STEPS.length)r.st.push(0);if(r.sbase===undefined)r.sbase=(r.status==='Отказ'?'Отказ':'Активен');

function metaSort(type){var s=STATE.meta.sort;var def=(STATE.meta.tabCfg[type]&&STATE.meta.tabCfg[type].defsort);
 if(!s[type])s[type]=def?clone(def):{k:'order',dir:1};return s[type];}
function sortFieldsFor(type){
 var f=tabFields(type).map(function(x){return [x[0],x[1]];});
 if(type==='pro'||type==='uch')f.push(['pct','Готовность']);
 if(type==='pro')f.push(['mar','Наценка']);
 return f;}
function sortVal(type,key,r){
 if(key==='pct'){var p=calc(r.st);return p===null?-1:p;}
 if(key==='mar')return (r.nasha&&r.summa)?(r.summa-r.nasha)/r.nasha:-1;
 if(key==='kubok')return r.kubok?1:0;
 var v=r[key];if(NUMK[key]){v=parseFloat(v);return isNaN(v)?-Infinity:v;}
 return (v===null||v===undefined)?'':String(v).toLowerCase();}
function sortRows(type,rows){var s=metaSort(type),k=s.k,d=s.dir;return rows.slice().sort(function(a,b){var x=sortVal(type,k,a),y=sortVal(type,k,b);if(x<y)return -d;if(x>y)return d;return 0;});}

 if(key==='kubok')return r.kubok?'Кубок':'—';
 var v=r[key];return (v===null||v===undefined||v==='')?'—':String(v);}

/* ================= PIN / вход в облако =================
   PIN теперь — это не просто локальный экран блокировки, а КЛЮЧ к вашим данным: документ в
   Firestore называется SHA-256(PIN). Введя один и тот же PIN на любом устройстве, вы попадаете
   в один и тот же планер. Поэтому: один PIN = один планер; если хотите начать новый — введите
   PIN, которого раньше не было, и подтвердите создание. */
var PIN_LEN=6;
var lock=document.getElementById("lock"),dotsEl=document.getElementById("dots"),lockSub=document.getElementById("lockSub");
var pinBuf="",pinMode="unlock",pinTmp="",pinPurpose="boot";
function updDots(){var f=pinBuf.length;dotsEl.innerHTML="";for(var i=0;i<PIN_LEN;i++){var el=document.createElement("i");if(i<f)el.className="f";dotsEl.appendChild(el);}}
function showLock(purpose){pinPurpose=purpose||"boot";pinBuf="";pinMode="unlock";lockSub.textContent="Введите PIN ("+PIN_LEN+" цифр)";updDots();lock.classList.add("on");}
function hideLock(){lock.classList.remove("on");if(pinPurpose==="boot")handleStartParam();}
function beginCreate(){pinMode="set1";pinBuf="";pinTmp="";lockSub.textContent="Придумайте новый PIN ("+PIN_LEN+" цифр)";updDots();lock.classList.add("on");}
function pinPress(k){
 if(pinMode==="busy")return; // идёт сетевой запрос — игнорируем ввод
 if(k==="del"){pinBuf=pinBuf.slice(0,-1);updDots();return;}
 if(pinBuf.length>=PIN_LEN)return;
 pinBuf+=k;updDots();
 if(pinBuf.length<PIN_LEN)return;
 if(pinMode==="unlock"){
  var entered=pinBuf;pinMode="busy";lockSub.textContent="Проверка…";
  sha256hex(entered).then(function(docId){
   loadPlanner(docId,function(saved,source){
    if(source==="cloud"||source==="cache"){
     STATE=shape(saved);PLANNER_DOC_ID=docId;
     try{localStorage.setItem(localCacheKey(),JSON.stringify(STATE));}catch(e){}
     renderAll();updateSaveBtn();
     if(source==="cache"){lockSub.textContent=fbDb?"Офлайн: локальные данные":"Готово";setTimeout(hideLock,700);}
     else hideLock();
    }else if(source==="error"){
     pinMode="unlock";pinBuf="";updDots();lockSub.textContent="Нет соединения. Попробуйте ещё раз";
    }else{ // notfound — либо опечатка, либо действительно новый PIN
     pinMode="unlock";
     if(confirm("Данных с таким PIN не найдено. Создать с ним новый пустой планер?")){
      STATE=shape(genSeed());PLANNER_DOC_ID=docId;DIRTY=true;persist();renderAll();hideLock();
     }else{pinBuf="";updDots();lockSub.textContent="Введите PIN ("+PIN_LEN+" цифр)";}
    }
   });
  });
 }else if(pinMode==="set1"){
  pinTmp=pinBuf;pinBuf="";updDots();pinMode="set2";lockSub.textContent="Повторите новый PIN";
 }else if(pinMode==="set2"){
  if(pinBuf!==pinTmp){
   dotsEl.classList.add("err");lockSub.textContent="Не совпало, заново";
   setTimeout(function(){dotsEl.classList.remove("err");pinBuf="";pinMode="set1";lockSub.textContent="Придумайте новый PIN ("+PIN_LEN+" цифр)";updDots();},700);
   return;
  }
  var newPin=pinBuf;pinMode="busy";lockSub.textContent="Сохранение…";
  sha256hex(newPin).then(function(newDocId){
   if(pinPurpose==="change"){
    var oldId=PLANNER_DOC_ID;PLANNER_DOC_ID=newDocId;DIRTY=true;persist();
    if(fbDb&&oldId&&oldId!==newDocId)fbDb.collection('planners').doc(oldId).delete().catch(function(){});
    hideLock();
   }else{
    STATE=shape(genSeed());PLANNER_DOC_ID=newDocId;DIRTY=true;persist();renderAll();hideLock();
   }
  });
 }
}

 if((el=t.closest("nav button"))){switchTab(el.dataset.v);return;}
 if(t.closest("#saveBtn")){if(DIRTY&&!SAVING){persist();haptic('light');}return;}
 if(t.closest("#gear")){openSettings();return;}
});
document.body.addEventListener("change",function(e){var t=e.target;
 if(t.classList.contains("sortsel")){metaSort(t.dataset.type).k=t.value;saveSoon();rerender(t.dataset.type);}
 else if(t.classList.contains("fltv")){var f=getFlt(t.dataset.type);f[t.dataset.key]=t.value;saveSoon();rerender(t.dataset.type);}
});
document.body.addEventListener("click",function(e){var b=e.target.closest(".sortdir");if(b){var s=metaSort(b.dataset.type);s.dir=-s.dir;saveSoon();rerender(b.dataset.type);}});
var qTimer=null;
document.body.addEventListener("input",function(e){var t=e.target;if(t.classList.contains("qsearch")){var tp=t.dataset.type;STATE.meta.search[tp]=t.value;clearTimeout(qTimer);qTimer=setTimeout(function(){saveSoon();var pos=t.selectionStart;rerender(tp);var ni=document.querySelector('.qsearch[data-type="'+tp+'"]');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}},220);}});

document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushSave();});
window.addEventListener('pagehide',flushSave);

function handleStartParam(){
 var p='';try{p=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param)||'';}catch(e){}
 if(!p)return;
 if(p==='export'){switchTab('obz');openSettings();setTimeout(function(){var b=document.getElementById('xExp');if(b)b.click();},50);}
 else if(p==='import'){switchTab('obz');openSettings();setTimeout(function(){var b=document.getElementById('xImp');if(b)b.click();},50);}
 else if(p==='settings'){switchTab('obz');openSettings();}
 else if(p.indexOf('tab_')===0){switchTab(p.slice(4));}
}
